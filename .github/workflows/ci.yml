name: CI
on:
  push:
    branches: [main]
  pull_request:

# Jobs only read the code; none may push, comment or change settings.
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o dist/ ./cmd/signalith
      # install.ps1 needs an elevated Windows with OpenSearch to run, so CI
      # checks the parts it can, with Windows PowerShell and PowerShell 7.
      - name: Check install.ps1 (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: .github/scripts/check-install-ps1.ps1
      - name: Check install.ps1 (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/check-install-ps1.ps1

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # The same tests with the data race detector on. It needs cgo, which
      # the Linux runner has. It is slow: internal/api alone takes about 6
      # minutes, so the 10 minute default limit is raised.
      - run: go test -race -timeout 20m ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # Fails when a known vulnerability is reachable from Signalith's code,
      # in a dependency or in the Go standard library it was built with.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  integration:
    runs-on: ubuntu-latest
    env:
      # The Docker quick start as users run it, plus an override that also
      # publishes OpenSearch on this machine for the Go tests.
      COMPOSE: docker compose -f deploy/docker/docker-compose.yml -f ${{ github.workspace }}/ci-opensearch-port.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Start the Docker quick start
        run: |
          cat > ci-opensearch-port.yml <<'EOF'
          services:
            opensearch:
              ports:
                - "127.0.0.1:9200:9200"
          EOF
          $COMPOSE up -d --build
      - name: Sign in to Signalith with the generated password
        run: |
          secrets="$RUNNER_TEMP/signalith-secrets"
          mkdir -p "$secrets"
          $COMPOSE cp signalith:/run/signalith-secrets/. "$secrets/"
          # Signalith makes its HTTPS certificate when it starts; wait for
          # it, then check every request against it.
          for i in $(seq 1 30); do
            $COMPOSE cp signalith:/var/lib/signalith/tls/ca.pem "$RUNNER_TEMP/signalith-ca.pem" 2>/dev/null &&
              curl -sf -o /dev/null --cacert "$RUNNER_TEMP/signalith-ca.pem" https://localhost:8080/api/tls/ca.pem && break
            sleep 2
          done
          password=$($COMPOSE exec -T signalith signalith initial-password)
          curl -sf -c "$RUNNER_TEMP/cookies" --cacert "$RUNNER_TEMP/signalith-ca.pem" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg p "$password" '{username: "admin", password: $p}')" \
            https://localhost:8080/api/login > /dev/null
          # OpenSearch loads its security settings a moment after it starts
          # answering, so the health may say "not initialized" at first.
          for i in $(seq 1 60); do
            health=$(curl -sf -b "$RUNNER_TEMP/cookies" --cacert "$RUNNER_TEMP/signalith-ca.pem" https://localhost:8080/api/health) &&
              echo "$health" | jq -e '.opensearch.status == "green" or .opensearch.status == "yellow"' > /dev/null && break
            sleep 2
          done
          echo "$health" | jq -e '.opensearch.status == "green" or .opensearch.status == "yellow"'
          # The public example password from earlier versions is refused.
          code=$(curl -s -o /dev/null -w '%{http_code}' --cacert "$RUNNER_TEMP/signalith-ca.pem" \
            -H 'Content-Type: application/json' -d '{"username":"admin","password":"change-me-please"}' \
            https://localhost:8080/api/login)
          test "$code" = 401
      - name: Check a new install refuses the old example ingest token
        run: |
          # Older quick starts gave every agent change-this-ingest-token,
          # which anyone can look up. Only an upgraded install accepts it;
          # this one started new, so it is a wrong token, over plain HTTP too.
          $COMPOSE cp signalith:/var/lib/signalith/docker-upgrade.json "$RUNNER_TEMP/docker-upgrade.json"
          jq -e '.upgraded == false' "$RUNNER_TEMP/docker-upgrade.json"
          for url in http://localhost:8080/api/ingest https://localhost:8080/api/ingest; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --cacert "$RUNNER_TEMP/signalith-ca.pem" \
              -H 'Authorization: Bearer change-this-ingest-token' -d '[{"log":"forged"}]' "$url")
            test "$code" = 401
          done
          # The install's own token works over HTTPS.
          code=$(curl -s -o /dev/null -w '%{http_code}' --cacert "$RUNNER_TEMP/signalith-ca.pem" \
            -H "Authorization: Bearer $(cat "$RUNNER_TEMP/signalith-secrets/ingest-token")" -d '[{"log":"hello"}]' https://localhost:8080/api/ingest)
          test "$code" = 200
      - name: Check OpenSearch refuses anyone without Signalith's certificate
        run: |
          ca="$RUNNER_TEMP/signalith-secrets/opensearch-ca.pem"
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert "$ca" https://localhost:9200/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert "$ca" -u admin:admin https://localhost:9200/)" = 401
          if curl -s -o /dev/null http://localhost:9200/; then echo "OpenSearch answers plain HTTP"; exit 1; fi
      - name: Encrypt a pasted API key the way docs/encryption.md shows
        working-directory: deploy/docker
        run: |
          printf 'assistant:\n  provider: anthropic\n  api_key: sk-ant-ci-pasted-0123456789\n' >> signalith.yaml
          owner=$(stat -c %u:%a signalith.yaml)
          docker compose run --rm --no-deps --user 0 --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER -v "${PWD}:/work" signalith secrets encrypt -c /work/signalith.yaml
          docker compose restart signalith
          grep -q 'api_key: enc:v1:' signalith.yaml
          if grep -q 'sk-ant-ci-pasted' signalith.yaml; then echo "the key is still in plain text"; exit 1; fi
          test "$(stat -c %u:%a signalith.yaml)" = "$owner"
          # The server's own account reads the master key the command made.
          docker compose exec -T signalith signalith secrets status | tee "$RUNNER_TEMP/secrets-status.txt"
          grep -q 'assistant.api_key *encrypted' "$RUNNER_TEMP/secrets-status.txt"
          grep -q ' 0 plain text' "$RUNNER_TEMP/secrets-status.txt"
          for i in $(seq 1 30); do
            curl -sf -o /dev/null --cacert "$RUNNER_TEMP/signalith-ca.pem" https://localhost:8080/api/tls/ca.pem && break
            sleep 2
          done
          curl -sf -o /dev/null --cacert "$RUNNER_TEMP/signalith-ca.pem" https://localhost:8080/api/tls/ca.pem
      - name: End-to-end tests against the secured OpenSearch
        env:
          SIGNALITH_TEST_OPENSEARCH: https://localhost:9200
          SIGNALITH_TEST_OPENSEARCH_CA: ${{ runner.temp }}/signalith-secrets/opensearch-ca.pem
          SIGNALITH_TEST_OPENSEARCH_CERT: ${{ runner.temp }}/signalith-secrets/opensearch-client.pem
          SIGNALITH_TEST_OPENSEARCH_KEY: ${{ runner.temp }}/signalith-secrets/opensearch-client-key.pem
        run: |
          # The tests use indices of their own; stop the server so it does
          # not work on them at the same time. The cluster tests run in the
          # cluster job.
          $COMPOSE stop signalith
          go test -tags integration -count=1 -v -skip '^TestCluster' ./internal/integration/
      - name: Container logs
        if: failure()
        run: $COMPOSE logs --no-color

  cluster:
    runs-on: ubuntu-latest
    env:
      # The secured OpenSearch of the Docker quick start, published on this
      # machine for the tests: servers that share one OpenSearch need its
      # security on.
      COMPOSE: docker compose -f deploy/docker/docker-compose.yml -f ${{ github.workspace }}/ci-opensearch-port.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Start the Docker quick start's OpenSearch
        run: |
          cat > ci-opensearch-port.yml <<'EOF'
          services:
            opensearch:
              ports:
                - "127.0.0.1:9200:9200"
          EOF
          $COMPOSE up -d --build
          # Signalith's OpenSearch certificate, which the test servers use;
          # the quick start's own server is not needed.
          secrets="$RUNNER_TEMP/signalith-secrets"
          mkdir -p "$secrets"
          $COMPOSE cp signalith:/run/signalith-secrets/. "$secrets/"
          $COMPOSE stop signalith
      # Two `signalith serve` processes per test share the OpenSearch, each
      # with its own state folder and the test's own index prefix, and HTTPS
      # on: one runs the background jobs, another takes over after kill -9
      # or SIGSTOP, and none takes over while its files differ. The tests
      # build the binary themselves, with the clustertest tag.
      - name: Several servers sharing one OpenSearch
        env:
          SIGNALITH_TEST_OPENSEARCH: https://localhost:9200
          SIGNALITH_TEST_OPENSEARCH_CA: ${{ runner.temp }}/signalith-secrets/opensearch-ca.pem
          SIGNALITH_TEST_OPENSEARCH_CERT: ${{ runner.temp }}/signalith-secrets/opensearch-client.pem
          SIGNALITH_TEST_OPENSEARCH_KEY: ${{ runner.temp }}/signalith-secrets/opensearch-client-key.pem
        run: go test -tags integration -count=1 -v -run '^TestCluster' -timeout 20m ./internal/integration/
      - name: Container logs
        if: failure()
        run: $COMPOSE logs --no-color

  release-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Cross-compile
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o dist/signalith-$os-$arch$ext ./cmd/signalith
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signalith-binaries
          path: dist/
