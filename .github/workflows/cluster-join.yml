name: Install script
# deploy/linux/install.sh, which Servers > Add a server runs on a new Linux
# server, in fresh Debian and Rocky Linux containers. Not a required check.
on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'cmd/signalith/**'
      - 'internal/clusterinstall/**'
      - '.github/scripts/test-install-sh.sh'
      - '.github/workflows/cluster-join.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'internal/clusterinstall/**'
      - '.github/scripts/test-install-sh.sh'
      - '.github/workflows/cluster-join.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-join-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:13', 'rockylinux:9']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=0.0.0-ci" -o bin/signalith ./cmd/signalith
      - name: Install with install.sh
        run: docker run --rm -v "$PWD:/work" -w /work "${{ matrix.image }}" sh .github/scripts/test-install-sh.sh
