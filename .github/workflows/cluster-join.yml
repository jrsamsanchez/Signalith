name: Install script
# deploy/linux/install.sh, which Servers > Add a server runs on a new Linux
# server, in fresh Debian and Rocky Linux containers. Not a required check.
on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'cmd/signalith/**'
      - 'internal/clusterinstall/**'
      - '.github/scripts/test-install-sh.sh'
      - '.github/workflows/cluster-join.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'internal/clusterinstall/**'
      - '.github/scripts/test-install-sh.sh'
      - '.github/workflows/cluster-join.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-join-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:13', 'rockylinux:9']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=0.0.0-ci" -o bin/signalith ./cmd/signalith
      - name: Install with install.sh
        run: docker run --rm -v "$PWD:/work" -w /work "${{ matrix.image }}" sh .github/scripts/test-install-sh.sh
