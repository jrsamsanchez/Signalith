name: Image (main)
# Builds Signalith's container image from main on every push and publishes it
# as ghcr.io/jrsamsanchez/signalith:main, the image the Docker quick start
# (deploy/docker/docker-compose.yml) downloads. Releases get their own tags
# from the Release workflow. The image is signed with Sigstore like a release,
# then scanned with Trivy; the report goes to the Security tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A build that has started runs to the end, and only the newest push waits
# behind it (GitHub drops older waiting ones), so on a busy merge day :main
# still gets built instead of every build being cancelled by the next.
concurrency:
  group: image-main
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/signalith
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name and version
        id: tags
        run: |
          echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "version=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.image }}:main
          push: true
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.title=Signalith
            org.opencontainers.image.description=Open-source SIEM
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image with Sigstore
        run: cosign sign --yes "${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # Known vulnerabilities in the image's system packages and Go modules,
      # fixed upstream. Reported in the Security tab, never fails the publish;
      # image-scan.yml scans :main again each week.
      - name: Scan the image with Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'
          version: v0.70.0
      - name: Upload the scan to the Security tab
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-image.sarif
          category: image-main
