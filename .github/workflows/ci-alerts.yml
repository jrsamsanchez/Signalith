name: CI alerts
# When a workflow fails on main (a push, a nightly or weekly run, or one
# started by hand), this opens an issue for it, or adds the new failure to
# the one already open, so a red main or a red nightly is never missed.
# When that workflow next succeeds on main, the issue is closed with a
# link to the green run. Pull requests are left out: their checks show on
# the pull request itself.
on:
  workflow_run:
    workflows:
      - CI
      - CodeQL
      - Nightly fuzz
      - Nightly load test
      - Cluster smoke
      - Helm chart
      - Mixed versions
      - Image (main)
      - Image scan
      - Content
      - Website
      - Docs
      - Links
      - Package repositories
      - Install script
      - Greenbone OpenVAS
      - Scorecard
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ci-alerts-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  alert:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WORKFLOW: ${{ github.event.workflow_run.name }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      EVENT: ${{ github.event.workflow_run.event }}
    steps:
      - name: Open, update or close the workflow's issue
        run: |
          title="Red on main: $WORKFLOW"
          open=$(gh issue list --state open --label ci-red --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ "$CONCLUSION" = success ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "Green again on main at ${SHA::7}: $RUN_URL"
            fi
            exit 0
          fi
          body="$WORKFLOW ended with \"$CONCLUSION\" on main at ${SHA::7} ($EVENT run): $RUN_URL"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again. $body"
          else
            gh label create ci-red --color B60205 --description "A workflow is failing on main" --force >/dev/null
            gh issue create --title "$title" --label ci-red \
              --body "$body

          This issue closes itself when $WORKFLOW next succeeds on main."
          fi
