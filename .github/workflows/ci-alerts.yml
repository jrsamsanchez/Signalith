name: CI alerts
# When a workflow fails on main (a push, a nightly or weekly run, or one
# started by hand), this opens an issue for it, or adds the new failure to
# the one already open, so a red main or a red nightly is never missed.
# When that workflow next succeeds on main, the issue is closed with a
# link to the green run, except for the nightly fuzz and load tests, whose
# issues stay open until a fix closes them. Pull requests are left out: their checks show on
# the pull request itself.
on:
  workflow_run:
    workflows:
      - CI
      - CodeQL
      - Nightly fuzz
      - Nightly load test
      - Cluster smoke
      - Helm chart
      - Mixed versions
      - Image (main)
      - Image scan
      - Content
      - Website
      - Docs
      - Links
      - Package repositories
      - Install script
      - Greenbone OpenVAS
      - Scorecard
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ci-alerts-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  alert:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WORKFLOW: ${{ github.event.workflow_run.name }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      EVENT: ${{ github.event.workflow_run.event }}
    steps:
      - name: Open, update or close the workflow's issue
        run: |
          title="Red on main: $WORKFLOW"
          open=$(gh issue list --state open --label ci-red --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          # A nightly fuzz or load test failure can pass the next night by
          # luck (fuzzing is random, timings vary) with nothing fixed, so
          # their issues stay open until the fix closes them ("Fixes #N"):
          # for fuzz, a commit that adds the failing input under
          # testdata/fuzz with the fix.
          stays_open=false
          case "$WORKFLOW" in "Nightly fuzz"|"Nightly load test") stays_open=true ;; esac
          if [ "$CONCLUSION" = success ]; then
            if [ -n "$open" ]; then
              if [ "$stays_open" = true ]; then
                gh issue comment "$open" --body "Green on main at ${SHA::7} ($RUN_URL), but this stays open until a fix closes it."
              else
                gh issue close "$open" --comment "Green again on main at ${SHA::7}: $RUN_URL"
              fi
            fi
            exit 0
          fi
          body="$WORKFLOW ended with \"$CONCLUSION\" on main at ${SHA::7} ($EVENT run): $RUN_URL"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again. $body"
          else
            gh label create ci-red --color B60205 --description "A workflow is failing on main" --force >/dev/null
            if [ "$stays_open" = true ]; then
              closes="Close it with the fix (\"Fixes #N\"); for fuzz, commit the failing input from the run's fuzz-failures artifact under testdata/fuzz with it."
            else
              closes="This issue closes itself when $WORKFLOW next succeeds on main."
            fi
            gh issue create --title "$title" --label ci-red \
              --body "$body

          $closes"
          fi
