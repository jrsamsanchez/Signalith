name: Cluster smoke
# Weekly, and by hand: builds the image from this code, starts the load
# balancer lab (deploy/docker/docker-compose.cluster.yml: two servers behind
# HAProxy with PROXY protocol, one OpenSearch) and runs
# deploy/docker/cluster-smoke.sh: agents and syslog reach both servers, each
# client is seen by its own address, and one server carries on when the
# other stops.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNALITH_IMAGE: signalith:local
      COMPOSE: docker compose -f deploy/docker/docker-compose.cluster.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -f deploy/docker/Dockerfile -t signalith:local .
      - name: Start the lab
        run: $COMPOSE up -d
      - name: Smoke test
        run: sh deploy/docker/cluster-smoke.sh
      - name: Logs
        if: failure()
        run: $COMPOSE logs --tail 200
      - name: Remove the lab
        if: always()
        run: $COMPOSE down -v
