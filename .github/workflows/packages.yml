name: Packages
# Builds Signalith's .deb, .rpm and .msi packages and tests installing,
# upgrading and removing each one. CI runs it on every change (unsigned
# packages, nothing published); the Release workflow runs it for a release,
# with the signing keys, and publishes what it built.
on:
  workflow_call:
    inputs:
      version:
        description: Version to build (empty in CI, which builds one above the latest release)
        type: string
        default: ""
    secrets:
      SIGNALITH_GPG_PRIVATE_KEY:
        required: false
      SIGNALITH_GPG_PASSPHRASE:
        required: false
    outputs:
      version:
        value: ${{ jobs.versions.outputs.version }}

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      previous: ${{ steps.v.outputs.previous }}
      previous_release: ${{ steps.v.outputs.previous_release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/package-versions.sh "${{ inputs.version }}" | tee -a "$GITHUB_OUTPUT"

  binaries:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go install github.com/tc-hib/go-winres@v0.3.3
      - name: Build for Linux (amd64, arm64) and Windows (amd64)
        env:
          VERSION: ${{ needs.versions.outputs.version }}
          PREVIOUS: ${{ needs.versions.outputs.previous }}
          PREVIOUS_RELEASE: ${{ needs.versions.outputs.previous_release }}
        run: |
          build() {
            # signalith.exe carries its name, version and icon, which Windows
            # shows in Properties and code signing checks.
            (cd cmd/signalith && go-winres simply --arch amd64 --manifest none \
              --icon ../../deploy/windows/msi/signalith.ico --product-name Signalith \
              --product-version "$1" --file-version "${1%%-*}.0" --original-filename signalith.exe \
              --file-description "Signalith SIEM" --copyright "Signalith contributors, Apache License 2.0")
            for target in linux/amd64 linux/arm64 windows/amd64; do
              os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$1" -o "$2/signalith-$os-$arch$ext" ./cmd/signalith
            done
            rm cmd/signalith/rsrc_windows_amd64.syso
          }
          build "$VERSION" dist
          # Without a release to upgrade from, the tests upgrade from this
          # code built as 0.0.0.
          [ -n "$PREVIOUS_RELEASE" ] || build "$PREVIOUS" previous
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries
          path: dist/
      - if: needs.versions.outputs.previous_release == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: previous-binaries
          path: previous/

  linux:
    needs: [versions, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries
          path: bin
      - name: Build the .deb and .rpm packages
        env:
          VERSION: ${{ needs.versions.outputs.version }}
          GPG_KEY: ${{ secrets.SIGNALITH_GPG_PRIVATE_KEY }}
          NFPM_PASSPHRASE: ${{ secrets.SIGNALITH_GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_KEY" ]; then
            export SIGNALITH_GPG_KEY_FILE="$RUNNER_TEMP/signing-key.asc"
            printf '%s\n' "$GPG_KEY" > "$SIGNALITH_GPG_KEY_FILE"
          fi
          deploy/packages/build.sh "$VERSION" packages bin
          rm -f "$RUNNER_TEMP/signing-key.asc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages
          path: packages/
      - if: needs.versions.outputs.previous_release == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: previous-binaries
          path: previous-bin
      - name: Get the packages to upgrade from
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.versions.outputs.previous }}
          PREVIOUS_RELEASE: ${{ needs.versions.outputs.previous_release }}
        run: |
          if [ -n "$PREVIOUS_RELEASE" ]; then
            gh release download "$PREVIOUS_RELEASE" --repo "$GITHUB_REPOSITORY" --dir previous --pattern '*_amd64.deb' --pattern '*.x86_64.rpm'
          else
            deploy/packages/build.sh "$PREVIOUS" previous previous-bin
          fi
      - name: Install, upgrade and remove the .deb
        env:
          VERSION: ${{ needs.versions.outputs.version }}
        run: .github/scripts/test-deb.sh previous/*_amd64.deb packages/*_amd64.deb "$VERSION"
      - name: Install, upgrade and remove the .rpm
        env:
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          mkdir rpms && cp previous/*.x86_64.rpm rpms/previous.rpm && cp packages/*.x86_64.rpm rpms/new.rpm
          .github/scripts/test-rpm.sh rpms/previous.rpm rpms/new.rpm "$VERSION"
      - name: Install from the apt and dnf repositories
        env:
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq apt-utils createrepo-c rpm
          .github/scripts/test-repos.sh packages "$VERSION"

  windows:
    needs: [versions, binaries]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries
          path: bin
      - name: Build the .msi
        shell: pwsh
        run: .\deploy\windows\msi\build.ps1 -Version "${{ needs.versions.outputs.version }}" -Exe bin\signalith-windows-amd64.exe -Out packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-packages
          path: packages/
      - if: needs.versions.outputs.previous_release == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: previous-binaries
          path: previous-bin
      - name: Get the .msi to upgrade from
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.versions.outputs.previous }}
          PREVIOUS_RELEASE: ${{ needs.versions.outputs.previous_release }}
        run: |
          if ($env:PREVIOUS_RELEASE) {
            gh release download $env:PREVIOUS_RELEASE --repo $env:GITHUB_REPOSITORY --dir previous --pattern '*.msi'
          } else {
            .\deploy\windows\msi\build.ps1 -Version $env:PREVIOUS -Exe previous-bin\signalith-windows-amd64.exe -Out previous
          }
      - name: Install, upgrade and uninstall the .msi
        shell: pwsh
        run: .github/scripts/test-msi.ps1 -Previous (Get-Item previous\*.msi).FullName -New (Get-Item packages\*.msi).FullName -Version "${{ needs.versions.outputs.version }}"
      - name: Installer logs
        if: failure()
        shell: pwsh
        run: |
          Get-Content "$env:windir\Temp\signalith-install.log" -ErrorAction SilentlyContinue
          Write-Host "== signalith.log"
          Get-Content "$env:ProgramData\Signalith\signalith.log" -Tail 100 -ErrorAction SilentlyContinue
          Write-Host "== Application events from Signalith"
          Get-WinEvent -FilterHashtable @{ LogName = "Application"; ProviderName = "Signalith" } -MaxEvents 30 -ErrorAction SilentlyContinue | Format-List TimeCreated, Message
          Write-Host "== Service Control Manager events"
          Get-WinEvent -FilterHashtable @{ LogName = "System"; ProviderName = "Service Control Manager" } -MaxEvents 15 -ErrorAction SilentlyContinue | Format-List TimeCreated, Message
          Get-ChildItem $env:RUNNER_TEMP -Filter 'msi-*.log' | ForEach-Object { Write-Host "== $($_.Name)"; Select-String -Path $_.FullName -Pattern 'Return value 3' -Context 30,2 | Select-Object -First 1 }
