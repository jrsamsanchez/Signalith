name: Website
# Publishes site/ (the project website) to GitHub Pages at https://signalith.io.
# Pages must be set to deploy from GitHub Actions (Settings > Pages > Build and
# deployment > Source), with signalith.io as its custom domain there; with
# Actions deployments the custom domain is that setting, not a CNAME file.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
