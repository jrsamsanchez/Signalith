# Weekly pull requests for updates to Go modules, the GitHub Actions CI
# uses (pinned by commit), and the Docker images (pinned by digest).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
    # The image builds with the Go in go.mod (TestImageBuildsWithTheGoInGoMod),
    # so a new Go minor version is a go.mod change made by hand.
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker-compose
    directory: /deploy/docker
    schedule:
      interval: weekly
