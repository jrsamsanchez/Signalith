# Signalith on one machine (Linux, or Windows with Docker Desktop), with
# HTTPS, a secured OpenSearch and no default passwords. It needs Docker
# Compose 2.20 or newer (check with: docker compose version). From the
# folder you cloned Signalith into:
#
#   1. Start it:
#        docker compose -f deploy/docker/docker-compose.yml up -d
#   2. Show the admin password it made for you:
#        docker compose -f deploy/docker/docker-compose.yml exec signalith signalith initial-password
#   3. Open https://localhost:9000 and sign in as signalithadmin with that password
#      (admin on an install made before 0.3.1).
#      The browser warns about the certificate until you trust it: use
#      "Download the server certificate" on the sign-in page (docs/https.md).
#
# To change the admin password later (the first one then stops working):
#   docker compose -f deploy/docker/docker-compose.yml exec signalith signalith passwd
#   docker compose -f deploy/docker/docker-compose.yml restart signalith
#
# If step 1 ends with 'service "opensearch-security" didn't complete
# successfully', OpenSearch has not loaded its security settings. This shows
# why and what to do, and docs/opensearch-security.md ("If OpenSearch's
# security settings aren't loaded") has more:
#   docker compose -f deploy/docker/docker-compose.yml logs opensearch-security
#
# To update: git pull, then step 1 again; it downloads the new Signalith
# image. Coming from a version without these steps? See "Upgrading the Docker
# quick start" in README.md.
#
# Signalith's image comes ready-made from GitHub (ghcr.io): the one built from
# main, or a release's with SIGNALITH_VERSION, for example in PowerShell
# $env:SIGNALITH_VERSION="0.1.0" or in a shell SIGNALITH_VERSION=0.1.0 before
# step 1 (use the same version as the code you checked out: git checkout
# v0.1.0). To build it from the code you checked out instead, add
# -f deploy/docker/docker-compose.build.yml to every command.
# Everything starts again by itself after a reboot once Docker is running
# (Docker Desktop: Settings > General > Start Docker Desktop when you sign in).
# The two steps that run once per "up", setup and opensearch-security, are
# not needed then: what they made and loaded is kept. But if the computer
# restarted while "up" was still waiting for opensearch-security, Signalith
# had not started yet and does not start by itself: run step 1 again.
services:
  # Runs before the others on every "up", then stops. It makes the
  # certificates OpenSearch and Signalith use with each other, the first
  # admin password and the agents' ingest token, and keeps them after that.
  # The CA those certificates come from keeps its key in a volume of its
  # own, opensearch-ca, which no other service mounts. Run by hand, it also
  # hands that CA to Signalith or reloads OpenSearch's security settings
  # (docs/opensearch-security.md), for example:
  #   docker compose -f deploy/docker/docker-compose.yml run --rm setup bootstrap-docker -export-ca-key
  setup:
    image: ghcr.io/jrsamsanchez/signalith:${SIGNALITH_VERSION:-main}
    pull_policy: always
    # Root, to give each file to the user that reads it: OpenSearch (1000)
    # or Signalith (65532), and allowed nothing else. It needs no network.
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    network_mode: none
    command: ["bootstrap-docker", "-opensearch-dir", "/opensearch-certs", "-signalith-dir", "/signalith-secrets", "-ca-dir", "/opensearch-ca", "-state-dir", "/signalith-data", "-loaded-dir", "/opensearch-security-loaded"]
    # The same folders for runs by hand, which replace the command above.
    environment:
      - SIGNALITH_SETUP_OPENSEARCH_DIR=/opensearch-certs
      - SIGNALITH_SETUP_SIGNALITH_DIR=/signalith-secrets
      - SIGNALITH_SETUP_CA_DIR=/opensearch-ca
      - SIGNALITH_SETUP_STATE_DIR=/signalith-data
      - SIGNALITH_SETUP_LOADED_DIR=/opensearch-security-loaded
      - SIGNALITH_SETUP_CRL_DIR=/opensearch-crl
    volumes:
      - opensearch-certs:/opensearch-certs
      - signalith-secrets:/signalith-secrets
      - opensearch-ca:/opensearch-ca
      # Written only by -export-ca-key and -apply-security.
      - signalith-data:/signalith-data
      - opensearch-security-loaded:/opensearch-security-loaded
      - opensearch-crl:/opensearch-crl
    restart: "no"

  opensearch:
    image: opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
    restart: unless-stopped
    depends_on:
      setup: { condition: service_completed_successfully }
    environment:
      - discovery.type=single-node
      # Skip the image's demo security setup, whose passwords and
      # certificates anyone can look up; the files below replace it.
      - DISABLE_INSTALL_DEMO_CONFIG=true
      # Skip the performance analyzer's separate agent: nothing here uses
      # it, and it would be one more program listening (port 9600).
      - DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    # Checks client certificates against the revocation list Signalith
    # keeps (docs/servers.md, Ending a server's OpenSearch access at once),
    # once setup has made it: OpenSearch refuses every certificate while
    # the list it checks is missing. After that (crl-required), it does not
    # start without the list, which would leave it checking nothing.
    entrypoint: ["sh", "-c", "if [ -s config/crl/crl.pem ]; then exec env plugins.security.ssl.http.crl.validate=true plugins.security.ssl.http.crl.file_path=/usr/share/opensearch/config/crl/crl.pem plugins.security.ssl.http.crl.disable_ocsp=true plugins.security.ssl.http.crl.disable_crldp=true plugins.security.ssl.http.crl.prefer_crlfile_over_ocsp=true ./opensearch-docker-entrypoint.sh \"$$@\"; fi; if [ -e config/crl/crl-required ]; then echo \"OpenSearch does not start without its revocation list, config/crl/crl.pem. Signalith writes it again within a minute, and so does: docker compose -f deploy/docker/docker-compose.yml up -d\" >&2; exit 1; fi; exec ./opensearch-docker-entrypoint.sh \"$$@\"", "sh"]
    command: ["opensearch"]
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    # No ports are published: only Signalith reaches OpenSearch, over HTTPS
    # and signed in with its own certificate.
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - opensearch-certs:/usr/share/opensearch/config/certs:ro
      - opensearch-crl:/usr/share/opensearch/config/crl:ro
      - ./opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./opensearch/security/config.yml:/usr/share/opensearch/config/opensearch-security/config.yml:ro
      - ./opensearch/security/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml:ro
      - ./opensearch/security/roles.yml:/usr/share/opensearch/config/opensearch-security/roles.yml:ro
      - ./opensearch/security/roles_mapping.yml:/usr/share/opensearch/config/opensearch-security/roles_mapping.yml:ro
      - ./opensearch/security/audit.yml:/usr/share/opensearch/config/opensearch-security/audit.yml:ro
    # Healthy once the cluster answers (asked with the admin certificate,
    # which works before the security settings are loaded) and its security
    # settings are loaded (_plugins/_security/health, which needs no
    # sign-in). opensearch-security loads them, which on a slow computer can
    # take up to about 10 minutes: until then it shows as starting, not
    # unhealthy (start_period).
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null --cacert /usr/share/opensearch/config/certs/root-ca.pem --cert /usr/share/opensearch/config/certs/admin.pem --key /usr/share/opensearch/config/certs/admin-key.pem https://localhost:9200/_cluster/health && curl -sf -o /dev/null --cacert /usr/share/opensearch/config/certs/root-ca.pem https://localhost:9200/_plugins/_security/health || exit 1"]
      interval: 10s
      start_period: 10m
      retries: 30
    # Keep at most 5 log files of 10 MB, so the container log cannot fill the disk.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Runs on every "up" once OpenSearch has started, then stops. It makes
  # sure OpenSearch has loaded its security settings: who may sign in, and
  # what each may do (the files in opensearch/security/). OpenSearch loads
  # them by itself only as it starts with none stored yet, and tries just
  # once, which can fail on a slow computer; it then refuses every request
  # with "Security not initialized". This loads them with securityadmin.sh and
  # the admin certificate, trying again while OpenSearch is slow, for about
  # 10 minutes. It loads them when OpenSearch has none loaded, or when the
  # files are not the ones it loaded last (the first time it runs, after an
  # update of Signalith that changes roles.yml, or after an edit), but not
  # on every "up": loading them is slow and can fail on a slow computer,
  # which would hold up Signalith for nothing.
  # Signalith starts only once this succeeds. Its log shows each step:
  #   docker compose -f deploy/docker/docker-compose.yml logs opensearch-security
  opensearch-security:
    image: opensearchproject/opensearch:3.9.0
    depends_on:
      setup: { condition: service_completed_successfully }
      # Started, not healthy: OpenSearch turns healthy only once its
      # security settings are loaded, which is this service's job. It waits
      # for OpenSearch to answer itself.
      opensearch: { condition: service_started }
    # OpenSearch's own user, the one that may read the admin certificate.
    user: "1000:1000"
    # Runs a copy of the script without Windows line endings (CRLF), which
    # a checkout on Windows can give it and which sh cannot run.
    entrypoint: ["sh", "-c", "tr -d '\\r' < /usr/share/opensearch/load-security.sh > /tmp/load-security.sh && exec sh /tmp/load-security.sh"]
    environment:
      # securityadmin.sh is a small Java program; keep its memory small.
      - JAVA_OPTS=-Xms32m -Xmx256m
    volumes:
      - opensearch-certs:/usr/share/opensearch/config/certs:ro
      - ./opensearch/load-security.sh:/usr/share/opensearch/load-security.sh:ro
      # The same files as OpenSearch's; the image has the other files there.
      - ./opensearch/security/config.yml:/usr/share/opensearch/config/opensearch-security/config.yml:ro
      - ./opensearch/security/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml:ro
      - ./opensearch/security/roles.yml:/usr/share/opensearch/config/opensearch-security/roles.yml:ro
      - ./opensearch/security/roles_mapping.yml:/usr/share/opensearch/config/opensearch-security/roles_mapping.yml:ro
      - ./opensearch/security/audit.yml:/usr/share/opensearch/config/opensearch-security/audit.yml:ro
      # Which files it loaded last. Docker gives a new volume the owner of
      # the folder it is put on, here uid 1000.
      - opensearch-security-loaded:/usr/share/opensearch/data
    # Hardening, as for Signalith: only the volume above and /tmp can be
    # written, and no extra privileges. /tmp allows running files: from
    # OpenSearch 3, securityadmin.sh unpacks a native library of its FIPS
    # crypto provider there and loads it.
    read_only: true
    tmpfs:
      - /tmp:exec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  signalith:
    # The image GitHub builds from this branch (main), or a release when
    # SIGNALITH_VERSION is set (for example 0.1.0). It is downloaded again on
    # every `up`, so after `git pull` the same command runs the new version.
    # To build it from the checked-out code instead, add
    # -f deploy/docker/docker-compose.build.yml (see that file).
    image: ghcr.io/jrsamsanchez/signalith:${SIGNALITH_VERSION:-main}
    pull_policy: always
    # A fixed name, which goes into Signalith's own HTTPS certificate and the
    # name of its certificate authority ("Signalith Local CA (signalith)").
    # Without it the name would be the container's random ID, new each time.
    # SIGNALITH_NODE_NAME in a .env file next to this file changes it.
    hostname: ${SIGNALITH_NODE_NAME:-signalith}
    # After a reboot this can start before OpenSearch is ready; it waits for it.
    restart: unless-stopped
    depends_on:
      setup: { condition: service_completed_successfully }
      # opensearch-security has made sure OpenSearch answers and has its
      # security settings loaded.
      opensearch-security: { condition: service_completed_successfully }
      # Then OpenSearch turns healthy within 10 seconds. If Docker had
      # marked it unhealthy before (when an earlier try gave up), that is
      # no reason to stop now (required: false, which needs Compose 2.20).
      opensearch: { condition: service_healthy, required: false }
    # A stop gives the background jobs up to a minute to finish before
    # another server takes them over.
    stop_grace_period: 90s
    # host.docker.internal is the computer running Docker, for an AI model
    # server there such as Ollama (Docker Desktop has it already; Linux
    # needs this line).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Web UI and API, over HTTPS (http:// is sent to https://).
      # Open on every network this computer is on. To take them from one
      # network only, put this computer's address there in front, e.g.
      # "192.168.1.20:9000:9000", and run docker compose up -d again.
      - "9000:9000"
      # Agents (Fluent Bit, OpenTelemetry, osquery, network sensors), over
      # HTTPS with the same certificate.
      - "7779:7779"
      # Plain syslog (off on a new install until you turn it on on the Add
      # data page, so nothing answers here until then; an install set up
      # before keeps it on): devices send to this machine on
      # port 514, which reaches the container's 5514 (it cannot open ports
      # below 1024). If another syslog server already uses 514 here, change
      # the left side, e.g. "1514:5514/udp", and syslog.public_port in
      # signalith.yaml to match.
      - "514:5514/udp"
      - "514:5514/tcp"
      # Syslog over TLS, with Signalith's own certificate: on by default.
      - "6514:6514"
    environment:
      # Secrets come from files the setup service made, never from this file.
      - SIGNALITH_ADMIN_PASSWORD_FILE=/run/signalith-secrets/initial-admin-password
      # A shared token for agents set up before per-agent tokens; Add data gives new agents their own.
      # When several servers share one OpenSearch and their settings, every
      # server accepts it; a changed file replaces it there when this server
      # starts, and an unchanged one never brings back a token retired on Add data.
      - SIGNALITH_INGEST_TOKEN_FILE=/run/signalith-secrets/ingest-token
      # This server's name on the Servers page. When several servers share
      # one OpenSearch, give each its own.
      - SIGNALITH_NODE_NAME=signalith-1
      # The revocation list OpenSearch checks client certificates against,
      # which this server keeps once the cluster keeps OpenSearch's CA.
      - SIGNALITH_OPENSEARCH_CRL_FILE=/run/opensearch-crl/crl.pem
      # Set to https://<this computer's IP>:9000 so agents on other machines can reach it
      # (they are given the same address on the agent port, 7779).
      # When several servers share one OpenSearch and their settings, the public
      # address is one for all of them: a change here applies to every server
      # when this server starts with it, and the Settings page can change it
      # again until this value changes.
      # - SIGNALITH_PUBLIC_URL=https://192.168.1.20:9000
    volumes:
      - ./signalith.yaml:/etc/signalith/signalith.yaml:ro
      - signalith-data:/var/lib/signalith
      - signalith-secrets:/run/signalith-secrets:ro
      - opensearch-crl:/run/opensearch-crl
      # Days archived before retention deletes them go to /var/lib/signalith/archive.
      # To keep them on another disk, mount a folder there (writable by uid 65532):
      # - /mnt/archive/signalith:/var/lib/signalith/archive
    # Hardening: only the volumes above can be written, no extra privileges,
    # and no core dumps that could hold secrets from memory.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    # Keep at most 5 log files of 10 MB, so the container log cannot fill the disk.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Opens OpenSearch's port to the other Signalith servers of a cluster
  # (Servers > Add a server > Prepare OpenSearch). Off unless the cluster
  # profile is on: put COMPOSE_PROFILES=cluster in a .env file next to this
  # file, so every "up" keeps it. It passes connections on as they are:
  # TLS and the client certificate still run between each server and
  # OpenSearch. Only open the port to the other servers in the firewall.
  opensearch-port:
    profiles: ["cluster"]
    image: ghcr.io/jrsamsanchez/signalith:${SIGNALITH_VERSION:-main}
    pull_policy: always
    command: ["tcp-forward", "-listen", "0.0.0.0:9200", "-to", "opensearch:9200"]
    restart: unless-stopped
    depends_on:
      opensearch: { condition: service_started }
    ports:
      # To take it from one network only, put this computer's address in
      # front, e.g. SIGNALITH_OPENSEARCH_PORT=192.168.1.20:9200 in .env.
      - "${SIGNALITH_OPENSEARCH_PORT:-9200}:9200"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  # Events, findings and investigations. Kept from earlier versions.
  opensearch-data:
  # OpenSearch's certificates, made by the setup service.
  opensearch-certs:
  # The OpenSearch CA's certificate and key, which the setup service makes
  # new certificates with; only setup mounts it. Guard it like a password.
  opensearch-ca:
  # A fingerprint of the security settings files opensearch-security loaded
  # last, so it loads them again only when they change.
  opensearch-security-loaded:
  # Detections, lists, dashboards, users, archived days, and the state
  # folder (SIGNALITH_STATE_DIR, /var/lib/signalith): Signalith's master key,
  # its own HTTPS certificate and this server's identity. Kept from earlier
  # versions.
  signalith-data:
  # Signalith's OpenSearch certificate, first admin password and ingest token.
  signalith-secrets:
  # The revocation list OpenSearch checks client certificates against:
  # made by setup, kept by Signalith, read by OpenSearch.
  opensearch-crl:
