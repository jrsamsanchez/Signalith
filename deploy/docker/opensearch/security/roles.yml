# What Signalith may do in OpenSearch. It signs in with its client
# certificate (CN=signalith; see roles_mapping.yml) and may do anything to
# its own indices, signalith* (events, risk, findings, investigations and
# threat intel), and read cluster health, disk use and its own tasks. It
# cannot read or change other indices or OpenSearch's security settings.
#
# Every OpenSearch call Signalith makes, and the permission that allows it:
#   GET    _cluster/health                         cluster_monitor
#   GET    _cluster/state/blocks (full disk)       cluster_monitor
#   GET    _nodes/stats/fs (retention disk guard)  cluster_monitor
#   GET    _tasks/<id> (retention waits on these)  cluster_monitor
#   GET    _nodes/_local/stats/os                  cluster_monitor
#          (servers compare their clocks with OpenSearch's)
#   GET    _cat/indices/<pattern>                  cluster_monitor, manage
#   GET    _cat/shards/<pattern>                   cluster_monitor, manage
#   GET    _index_template/<prefix> (a newer one is kept)
#   PUT    _index_template/<prefix>, <prefix>_runtime
#                                                  indices:admin/index_template/*
#   POST   _bulk (events, threat intel, restores)  cluster_composite_ops, crud
#   POST   _search/scroll, DELETE _search/scroll   indices:data/read/scroll*
#          (retention archives and checks)
#   POST   <index>/_search, <index>/_count         crud
#   POST   _mget (heartbeats and the job lease)    cluster_composite_ops, crud
#   GET    <index>/_doc/<id>                       crud
#   PUT    <index>/_doc/<id>, <index>/_create/<id> crud
#   POST   <index>/_update/<id>                    crud
#   DELETE <index>/_doc/<id> (only if unchanged)   crud
#   POST   <index>/_update_by_query                crud
#   POST   <index>/_delete_by_query                crud
#   PUT    <index> (findings, cases, threat intel, restored days,
#          <prefix>_runtime where servers find each other)
#                                                  create_index
#   GET    <index>/_mapping, PUT <index>/_mapping  manage
#   GET    <index>/_settings, PUT <index>/_settings (write blocks,
#          copies on other nodes)                  manage
#   POST   <index>/_refresh, <index>/_forcemerge   manage
#   DELETE <index> (retention)                     manage
#
# With an opensearch.index_prefix other than signalith, change signalith*
# below to match it.
#
# signalith_snapshots is for scheduled snapshots (Settings > Server >
# Backups, docs/backup.md). The server that runs the background jobs keeps
# an OpenSearch Snapshot Management policy, <prefix>-daily, which takes
# snapshots of Signalith's indices into the repository the settings name
# and deletes the oldest. OpenSearch runs the policy with the roles of the
# user that wrote it, so Signalith needs these itself. Its certificates
# get the role in roles_mapping.yml; nothing uses it until scheduled
# snapshots are turned on. It names each action, so it cannot restore or
# clone snapshots. OpenSearch's snapshot permissions are not limited to
# one repository, so Signalith could delete any repository's snapshots,
# and snapshots it can delete do not protect against someone who has
# Signalith's credentials: copy the repository off-site or to WORM
# (object lock) storage (docs/backup.md). On an OpenSearch shared with
# others, remove the mapping and take snapshots another way. To stop
# scheduled snapshots for good, also delete the policy
# (DELETE _plugins/_sm/policies/<prefix>-daily): OpenSearch keeps running
# it with the roles stored with it.
#   GET    _snapshot/<repository>                  cluster:admin/repository/get
#   GET    _snapshot/<repository>/<prefix>-daily-* cluster:admin/snapshot/get
#   POST, PUT _plugins/_sm/policies/<prefix>-daily cluster:admin/opensearch/snapshot_management/policy/write
#   GET    _plugins/_sm/policies/<prefix>-daily    cluster:admin/opensearch/snapshot_management/policy/get
#   DELETE _plugins/_sm/policies/<prefix>-daily    cluster:admin/opensearch/snapshot_management/policy/delete
#   GET    _plugins/_sm/policies/<prefix>-daily/_explain
#                                                  cluster:admin/opensearch/snapshot_management/policy/explain
#   and, run by OpenSearch as Signalith: take and delete snapshots
#                                                  cluster:admin/snapshot/create
#                                                  cluster:admin/snapshot/delete
#
# signalith_cold_storage is for cold storage (docs/cold-storage.md), which
# keeps old days in a snapshot repository such as an S3 bucket. It is
# mapped to Signalith when cold storage is turned on
# (roles_mapping.cold.yml); it can also restore (mount) snapshots, which
# signalith_snapshots cannot. signalith_snapshots, mapped by default, also
# takes and deletes snapshots, so remove both mappings to keep Signalith
# away from snapshots.
# Signalith itself only touches snapshots named <prefix>-* in the
# repository <prefix>-cold.
#   GET    _snapshot/<prefix>-cold                 cluster:admin/repository/get
#   GET    _snapshot/<prefix>-cold/<prefix>-*      cluster:admin/snapshot/get
#   PUT    _snapshot/<prefix>-cold/<name>          cluster:admin/snapshot/create
#   POST   _snapshot/<prefix>-cold/<name>/_restore (mounts a day)
#                                                  cluster:admin/snapshot/restore
#   DELETE _snapshot/<prefix>-cold/<name>          cluster:admin/snapshot/delete
_meta:
  type: "roles"
  config_version: 2

signalith_server:
  description: "Signalith: its own indices (signalith*) and cluster health"
  cluster_permissions:
    - "cluster_monitor"
    - "cluster_composite_ops"
    - "indices:data/read/scroll*"
    - "indices:admin/index_template/*"
  index_permissions:
    - index_patterns:
        - "signalith*"
      allowed_actions:
        - "crud"
        - "create_index"
        - "manage"

signalith_snapshots:
  description: "Signalith scheduled snapshots: its Snapshot Management policy, <prefix>-daily, and the snapshots it takes"
  cluster_permissions:
    - "cluster:admin/opensearch/snapshot_management/policy/write"
    - "cluster:admin/opensearch/snapshot_management/policy/get"
    - "cluster:admin/opensearch/snapshot_management/policy/delete"
    - "cluster:admin/opensearch/snapshot_management/policy/explain"
    - "cluster:admin/snapshot/create"
    - "cluster:admin/snapshot/get"
    - "cluster:admin/snapshot/delete"
    - "cluster:admin/repository/get"

signalith_cold_storage:
  description: "Signalith cold storage: snapshots of its own days in the <prefix>-cold repository"
  cluster_permissions:
    - "cluster:admin/repository/get"
    - "cluster:admin/snapshot/get"
    - "cluster:admin/snapshot/create"
    - "cluster:admin/snapshot/restore"
    - "cluster:admin/snapshot/delete"
