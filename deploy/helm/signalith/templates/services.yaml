{{- $full := include "signalith.fullname" . -}}
{{- $port := int .Values.server.port -}}
{{- $svc := .Values.server.service -}}
# The web UI and API, and the agent port (HTTPS), on every ready server.
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "signalith.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with $svc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $svc.type }}
  {{- if and (ne $svc.type "ClusterIP") $svc.externalTrafficPolicy }}
  externalTrafficPolicy: {{ $svc.externalTrafficPolicy }}
  {{- end }}
  {{- if and (eq $svc.type "LoadBalancer") $svc.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml $svc.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  selector:
    {{- include "signalith.selector" (dict "ctx" . "component" "server") | nindent 4 }}
  ports:
    - name: https
      port: {{ $port }}
      targetPort: https
      protocol: TCP
    - name: agents
      port: {{ include "signalith.agentPort" . }}
      targetPort: agents
      protocol: TCP
{{- $as := .Values.server.agentService | default dict }}
{{- if $as.enabled }}
---
# The agent port alone (HTTPS, and each agent sends its token), for agents
# outside the cluster when the web page goes through an Ingress, which
# never carries the agent port.
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-agents
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "signalith.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with $as.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $as.type | default "LoadBalancer" }}
  {{- if and (ne ($as.type | default "LoadBalancer") "ClusterIP") $as.externalTrafficPolicy }}
  externalTrafficPolicy: {{ $as.externalTrafficPolicy }}
  {{- end }}
  {{- if and (eq ($as.type | default "LoadBalancer") "LoadBalancer") $as.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml $as.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  selector:
    {{- include "signalith.selector" (dict "ctx" . "component" "server") | nindent 4 }}
  ports:
    - name: agents
      port: {{ include "signalith.agentPort" . }}
      targetPort: agents
      protocol: TCP
{{- end }}
---
# Each server and scanner by name ($(POD_NAME).<this>), for the servers
# to reach each other, ready or not.
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-pods
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "signalith.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ include "signalith.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: https
      port: {{ $port }}
      targetPort: https
      protocol: TCP
{{- if .Values.server.syslog.enabled }}
{{- $ss := .Values.server.syslog.service }}
---
# Syslog over TLS on 6514, and with server.syslog.plain plain syslog on
# UDP and TCP 514 (the pods listen on 5514, being unprivileged).
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-syslog
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "signalith.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with $ss.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $ss.type }}
  {{- if and (ne $ss.type "ClusterIP") $ss.externalTrafficPolicy }}
  externalTrafficPolicy: {{ $ss.externalTrafficPolicy }}
  {{- end }}
  {{- if and (eq $ss.type "LoadBalancer") $ss.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml $ss.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  selector:
    {{- include "signalith.selector" (dict "ctx" . "component" "server") | nindent 4 }}
  ports:
    {{- if include "signalith.plainSyslog" . }}
    - { name: syslog-udp, port: 514, targetPort: syslog-udp, protocol: UDP }
    - { name: syslog-tcp, port: 514, targetPort: syslog-tcp, protocol: TCP }
    {{- end }}
    - { name: syslog-tls, port: 6514, targetPort: syslog-tls, protocol: TCP }
{{- end }}
