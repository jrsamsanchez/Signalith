# The servers' own account, with no rights and no token: Signalith never
# calls the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "signalith.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "signalith.labels" . | nindent 4 }}
automountServiceAccountToken: false
