# nginx (stream module) in front of several Signalith servers: the same as
# haproxy.cfg, for sites that run nginx. Put this at the top level of
# nginx.conf (next to the http block, not inside it). See README.md.
#
# Connections pass through unchanged, each starting with a PROXY protocol
# header naming the real client (proxy_protocol on). Turn on
# server.proxy_protocol and syslog.proxy_protocol in Signalith and list this
# balancer's address under server.trusted_proxies.
#
# Open source nginx has no active health checks: a server that stops is
# taken out after a failed connection (max_fails, fail_timeout). A server
# that is up but not ready (/readyz 503) still gets connections; use HAProxy
# or a balancer with active checks when that matters.

stream {
    upstream signalith_web {
        least_conn;
        server siem-a:8080 max_fails=2 fail_timeout=10s;
        server siem-b:8080 max_fails=2 fail_timeout=10s;
    }
    upstream signalith_syslog_tls {
        least_conn;
        server siem-a:6514 max_fails=2 fail_timeout=10s;
        server siem-b:6514 max_fails=2 fail_timeout=10s;
    }
    upstream signalith_syslog_tcp {
        least_conn;
        server siem-a:5514 max_fails=2 fail_timeout=10s;
        server siem-b:5514 max_fails=2 fail_timeout=10s;
    }

    proxy_protocol on;
    proxy_connect_timeout 5s;
    # Agents and syslog devices keep their connections open.
    proxy_timeout 2h;

    server {
        listen 8443;
        proxy_pass signalith_web;
    }
    server {
        listen 6514;
        proxy_pass signalith_syslog_tls;
    }
    server {
        listen 514;
        proxy_pass signalith_syslog_tcp;
    }
}
