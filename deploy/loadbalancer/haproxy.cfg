# HAProxy in front of several Signalith servers that share one OpenSearch.
# See README.md in this folder and docs/load-balancers.md.
#
# Connections pass through unchanged (TCP mode), so HTTPS and syslog over TLS
# end at Signalith and agents keep checking Signalith's own certificate. Each
# connection starts with a PROXY protocol v2 header naming the real client,
# which Signalith reads when server.proxy_protocol and syslog.proxy_protocol
# are on and this balancer's address is under server.trusted_proxies.
#
# Change the server addresses (siem-a, siem-b) to your servers'. The docker
# compose lab (deploy/docker/docker-compose.cluster.yml) uses this file as
# it is.

global
    log stdout format raw local0
    # No maxconn: HAProxy works it out from the open files it may have.

# Server names are looked up again while HAProxy runs, so a server that
# moves to another address (a container that restarts) is found, and
# HAProxy still starts while one name does not resolve.
resolvers dns
    parse-resolv-conf
    hold valid 10s

defaults
    log global
    mode tcp
    option tcplog
    # A connection a stopped server refuses goes to another server at once,
    # before the health checks have taken it out.
    retries 3
    option redispatch
    timeout connect 5s
    # Agents keep their connection open between batches, and quiet syslog
    # devices for much longer: don't cut them off.
    timeout client 2h
    timeout server 2h
    timeout check 5s

# Web page, API and agents (HTTPS, passed through).
frontend web
    bind :8443
    default_backend signalith_web

backend signalith_web
    # Any server takes any request once the servers share their users.
    balance leastconn
    # /readyz says whether a server should get traffic (starting, restarting,
    # stopping or cut off from OpenSearch: not). It answers over plain HTTP on
    # the HTTPS port too. To check over HTTPS instead, add
    # "check-ssl verify required ca-file /path/to/ca.pem" to default-server.
    option httpchk GET /readyz
    http-check expect status 200
    default-server resolvers dns init-addr last,libc,none check inter 5s fall 3 rise 2 send-proxy-v2 check-send-proxy
    server siem-a siem-a:8080
    server siem-b siem-b:8080

# Syslog over TLS (RFC 5425).
frontend syslog_tls
    bind :6514
    default_backend signalith_syslog_tls

backend signalith_syslog_tls
    # A device keeps one connection open; balance by connection count.
    balance leastconn
    default-server resolvers dns init-addr last,libc,none check port 8080 inter 5s fall 3 rise 2 send-proxy-v2
    server siem-a siem-a:6514
    server siem-b siem-b:6514

# Syslog over TCP.
frontend syslog_tcp
    bind :514
    default_backend signalith_syslog_tcp

backend signalith_syslog_tcp
    balance leastconn
    default-server resolvers dns init-addr last,libc,none check port 8080 inter 5s fall 3 rise 2 send-proxy-v2
    server siem-a siem-a:5514
    server siem-b siem-b:5514

# Syslog over UDP has no PROXY protocol: send it to a virtual IP that moves
# between the balancers (keepalived.conf), or straight to one server.
