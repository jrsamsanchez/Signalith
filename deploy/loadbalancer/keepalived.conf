# keepalived on two load balancer machines (lb-1 and lb-2): one address, the
# virtual IP 10.0.0.100, moves to the other balancer when one fails, so
# agents, browsers and syslog devices keep one address. Install this on both,
# with state BACKUP and a lower priority on lb-2. See README.md.
#
# It also balances syslog over UDP, which has no PROXY protocol: with
# lb_kind DR (direct routing) the servers see each device's own address.
# Direct routing needs the virtual IP on each Signalith server's loopback
# interface (ip addr add 10.0.0.100/32 dev lo) and ARP for it turned off
# there (net.ipv4.conf.all.arp_ignore=1, arp_announce=2). Without that, send
# UDP syslog straight to one server instead.

global_defs {
    router_id lb-1
    enable_script_security
    script_user root
}

# The balancer is healthy while HAProxy runs.
vrrp_script haproxy_running {
    script "/usr/bin/pgrep -x haproxy"
    interval 2
    fall 2
    rise 2
}

vrrp_instance signalith {
    state MASTER            # BACKUP on lb-2
    interface eth0
    virtual_router_id 51
    priority 150            # 100 on lb-2
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass changeme   # the same on both, at most 8 characters
    }
    virtual_ipaddress {
        10.0.0.100/24
    }
    track_script {
        haproxy_running
    }
}

# Syslog over UDP to the Signalith servers, checked with /readyz on their
# web port (9000), as HAProxy checks its backends: a server that is starting,
# restarting, stopping, drained or cut off from OpenSearch gets no syslog.
# The check asks over plain HTTP, which the web port answers /readyz on even
# though it serves HTTPS, so no certificate is involved, and without a PROXY
# header, which a trusted proxy may leave out (the balancers' addresses are
# under server.trusted_proxies). curl -f fails on the 503 a server that is
# not ready answers.
virtual_server 10.0.0.100 514 {
    delay_loop 5
    lb_algo sh              # source hashing: each device stays on one server
    lb_kind DR
    protocol UDP

    real_server 10.0.0.11 514 {
        MISC_CHECK {
            misc_path "/usr/bin/curl -fsS -o /dev/null --max-time 3 http://10.0.0.11:9000/readyz"
            misc_timeout 5
        }
    }
    real_server 10.0.0.12 514 {
        MISC_CHECK {
            misc_path "/usr/bin/curl -fsS -o /dev/null --max-time 3 http://10.0.0.12:9000/readyz"
            misc_timeout 5
        }
    }
}
