id: starter-password-spraying
title: Password spraying and brute force
description: Look for sources that guess passwords across many accounts, or many passwords against one, and check whether any of them got in.
techniques: [T1110.001, T1110.003, T1078]
time_range: 7d
cells:
  - kind: markdown
    text: |
      ## Hypothesis
      An attacker is guessing passwords. **Spraying** tries a few common passwords against many accounts to stay under lockout limits; **brute force** tries many passwords against one account.

      ## What to look for
      - One source failing against **many different accounts**
      - A source that failed many times and then **signed in**
      - Failures at odd hours, or from addresses outside your network

      Lower the thresholds in the searches if your environment is small.
  - kind: search
    title: Sources failing against many accounts
    query: |
      datamodel=Authentication action=failure
      | stats dc(user) as accounts, count as failures, min(_time) as first_seen, max(_time) as last_seen by src
      | where accounts >= 3
      | sort -accounts
  - kind: search
    title: Sources that failed, then signed in
    query: |
      datamodel=Authentication
      | stats count(eval(action="failure")) as failures, count(eval(action="success")) as successes, values(user) as accounts by src
      | where failures >= 5 AND successes > 0
      | sort -failures
  - kind: search
    title: Failed sign-ins over time, by application
    query: datamodel=Authentication action=failure | timechart span=1h count by app
  - kind: markdown
    text: |
      ## If you find something
      1. Add the source and the accounts to an investigation with **Link to case**.
      2. Check what each account that signed in did next: search `datamodel=Endpoint user=<account>`.
      3. Reset the passwords, end the sessions and require two-step sign-in for those accounts.
      4. Block the source address if it is outside your network.
