id: auth-password-spray
title: Password spray from $src$ against $users$ accounts
name: Password spray
description: One source failed to log on as many different accounts, the pattern of trying one password against many users.
query: |
  datamodel=Authentication action=failure
  | stats dc(user) as users, count by src
  | where users >= 5
  | sort -users
schedule: 10m
lookback: 1h
severity: high
mitre: [T1110.003]
throttle:
  fields: [src]
  window: 4h
risk:
  score: 50
  objects:
    - {field: src, type: system}
enabled: true
tags: [authentication]
