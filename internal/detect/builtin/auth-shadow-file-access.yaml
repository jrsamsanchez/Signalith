id: auth-shadow-file-access
title: $src_user$ read password hashes on $dest$ with sudo
name: Password hashes read with sudo
description: A sudo command touched /etc/shadow or /etc/gshadow, where Linux stores password hashes.
query: |
  datamodel=Authentication app=sudo action=success process IN ("*/etc/shadow*", "*/etc/gshadow*")
schedule: 5m
lookback: 10m
severity: high
mitre: [T1003.008]
throttle:
  fields: [src_user, dest, process]
  window: 24h
risk:
  score: 60
  objects:
    - {field: src_user, type: user}
    - {field: dest, type: system}
enabled: true
tags: [credential-access, linux]
