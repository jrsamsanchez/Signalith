id: network-dns-tunneling
title: Possible DNS tunnelling from $src$
name: Possible DNS tunnelling
description: One host looked up many different names with a label of 40 characters or more, the way tools that hide data or commands inside DNS questions (iodine, dnscat2, DNS-based command and control) do.
query: |
  datamodel=Network_Resolution query=~"[A-Za-z0-9_-]{40,}"
  | stats count, dc(query) as names, min(_time) as first_seen by src
  | enrich src
  | where names >= 10 AND NOT src_category=~"(?i)dns|domain.?controller"
schedule: 10m
lookback: 30m
severity: medium
mitre: [T1071.004, T1572, T1048.003]
throttle:
  fields: [src]
  window: 4h
risk:
  score: 40
  objects:
    - {field: src, type: system}
enabled: true
tags: [network, dns, command-and-control, exfiltration, pci-dss:10.4.1, pci-dss:11.5.1, nist-800-53:SI-4, cis-v8:13.3]
guidance: >-
  Open the lookups (View contributing events) and look at the parent domain the long
  names end in: one domain with many random-looking labels is the tunnel. Some
  antivirus and reputation services (file hash lookups over DNS) and a few CDNs also use
  long labels; add an exception on src, or a NOT query=*.<domain> to the search, for
  those. Network sensors set src (the host that asked); host DNS logs (Sysmon 22) set
  dest instead and are not counted here. Resolvers are left out: a source whose asset
  category contains dns or domain-controller (in the asset list) is not counted,
  because a sensor on the internet link sees your DNS servers ask upstream for every
  client. Give your resolvers one of those categories; to find the client behind a
  resolver, mirror the traffic between clients and the resolver, or read the
  resolver's own query log.
