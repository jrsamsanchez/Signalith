id: network-dns-nxdomain-burst
title: Burst of failed DNS lookups from $src$ ($names$ names)
name: Burst of failed DNS lookups (possible DGA)
description: One host asked for 25 or more different names that do not exist within 15 minutes. Malware with a domain generation algorithm (DGA) tries many generated names until it finds the one its operator registered.
query: |
  datamodel=Network_Resolution reply_code=NXDomain
  | stats count, dc(query) as names, min(_time) as first_seen by src
  | enrich src
  | where names >= 25 AND NOT src_category=~"(?i)dns|domain.?controller"
schedule: 5m
lookback: 15m
severity: medium
mitre: [T1568.002]
throttle:
  fields: [src]
  window: 4h
risk:
  score: 30
  objects:
    - {field: src, type: system}
enabled: true
tags: [network, dns, command-and-control, pci-dss:10.4.1, pci-dss:11.5.1, nist-800-53:SI-4, cis-v8:13.3]
guidance: >-
  Look at the names (View contributing events): random-looking names under one or a few
  top-level domains point to a DGA; names of your own shares and servers point to a
  stale drive mapping or a misconfigured search domain. If the host also looked up a
  name that did resolve right after the burst, that address is the likely command and
  control server: search datamodel=Network_Traffic src=<src> dest=<address>.
  Resolvers are left out: a sensor on the internet link sees your DNS servers (in an
  Active Directory network, the domain controllers) ask upstream for every client, so
  their lookups add up the whole organisation's typos and probes, and hide which client
  asked. A source whose asset category contains dns or domain-controller (in the asset
  list) is not counted, so give your resolvers one of those categories. To see the
  client behind a resolver, put the sensor where it sees clients ask the resolver, or
  read the resolver's own query log.
