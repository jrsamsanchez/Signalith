id: vuln-critical
title: Critical vulnerability $signature_id$ on $dest$
name: Critical vulnerability found
description: A vulnerability scan found software with a critical vulnerability (CVSS 9 or higher) that is not yet known to be used by attackers. Critical vulnerabilities can often be exploited over the network without a password. Known exploited ones raise their own, higher finding. A match by version alone on a build a Linux distribution made (vuln_confidence=version_only) does not raise it, since distributions fix CVEs without changing the version; it stays on the Vulnerabilities page. A match to the exact version of an installed package that its distribution fixed in a later version (vuln_confidence=package, from osquery's package list) does raise it.
query: |
  datamodel=Vulnerabilities category=vulnerability cvss>=9 known_exploited=false NOT vuln_confidence=version_only
schedule: 15m
lookback: 30m
severity: medium
mitre: [T1190, T1210]
throttle:
  fields: [dest, signature_id]
  window: 7d
risk:
  score: 25
  objects:
    - {field: dest, type: system}
enabled: true
tags: [vulnerability]
guidance: Plan to patch or upgrade the software named in product and product_version soon; the NVD page in url lists the fixed versions. If the service does not need to be reachable, limit who can reach it until it is patched. Search datamodel=Vulnerabilities dest=<host> to see everything the scan found on it.
