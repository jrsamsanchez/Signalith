id: network-cleartext-credentials
title: Cleartext sign-in from $src$ to $dest$ on port $dest_port$
name: Credentials sent in clear text
description: A user name and password crossed the network unencrypted, over HTTP basic authentication, FTP or Telnet, where anyone on the path can read them.
query: |
  (signature="Web request" user=*)
  OR (sourcetype="zeek:ftp" zeek_user=* NOT zeek_user IN (anonymous, ftp, "<unknown>"))
  OR (signature=Connection dest_port=23 transport=tcp action=allowed NOT direction=inbound)
  | stats count, min(_time) as first_seen by src, dest, dest_port, sourcetype
schedule: 15m
lookback: 30m
severity: low
mitre: [T1552, T1040]
throttle:
  fields: [src, dest, dest_port]
  window: 24h
risk:
  score: 15
  objects:
    - {field: src, type: system}
    - {field: dest, type: system}
enabled: true
tags: [network, credential-access, pci-dss:10.4.1, pci-dss:11.5.1, nist-800-53:SI-4, cis-v8:13.3]
guidance: >-
  Move the service to HTTPS, SFTP or SSH, and change the password that was sent, since it
  may have been captured. Telnet is counted when a connection to port 23 was answered,
  except from the internet (the sensor cannot see the password itself); the vulnerability scan's Telnet finding
  names the servers that offer it. HTTP basic authentication is counted from the user
  name Zeek logs (the password is never stored). Printers and old appliances are the
  usual sources; add an exception on dest for one you cannot change yet.
