# OpenSearch's own audit log for Signalith, written to OpenSearch's log
# (plugins.security.audit.type: log4j in opensearch.yml): failed sign-ins,
# refused requests, bad headers, TLS errors and changes to the security
# settings. Successful requests, which are Signalith's own searches and
# writes, are left out. No request body or document is logged, so no
# event data or password hash reaches the log. This replaces the image's
# audit.yml, which logs request bodies.
_meta:
  type: "audit"
  config_version: 2

config:
  enabled: true
  audit:
    enable_rest: true
    disabled_rest_categories:
      - AUTHENTICATED
      - GRANTED_PRIVILEGES
    enable_transport: true
    disabled_transport_categories:
      - AUTHENTICATED
      - GRANTED_PRIVILEGES
    ignore_users: []
    ignore_requests: []
    resolve_bulk_requests: false
    log_request_body: false
    resolve_indices: true
    exclude_sensitive_headers: true
  compliance:
    enabled: true
    internal_config: true
    external_config: false
    read_metadata_only: true
    read_watched_fields: {}
    read_ignore_users: []
    write_metadata_only: true
    write_log_diffs: false
    write_watched_indices: []
    write_ignore_users: []
