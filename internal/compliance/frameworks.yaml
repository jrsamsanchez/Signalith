    controls:
      - {id: A.5.7, group: Organizational controls, title: Gather and use threat intelligence, caps: [intel], nist: [PM-16]}
      - {id: A.5.9, group: Organizational controls, title: Keep an inventory of assets, caps: [assets, data-inventory], nist: [CM-8]}
      - {id: A.5.24, group: Organizational controls, title: Plan and prepare for incidents, caps: [cases, response], nist: [IR-4]}
      - {id: A.5.25, group: Organizational controls, title: Assess security events, caps: [triage], nist: [IR-5]}
      - {id: A.5.26, group: Organizational controls, title: Respond to incidents, caps: [cases, response], nist: [IR-4]}
      - {id: A.5.28, group: Organizational controls, title: Collect and keep evidence, caps: [cases, retention-1y], nist: []}
      - {id: A.8.2, group: Technological controls, title: Watch the use of privileged access, caps: [data-auth, detect-privilege], nist: [AC-6(9)]}
      - {id: A.8.7, group: Technological controls, title: Protect against malware, caps: [data-malware, detect-malware], nist: [SI-3]}
      - {id: A.8.8, group: Technological controls, title: Manage technical vulnerabilities, caps: [vuln-scan], nist: [RA-5, SI-2]}
      - {id: A.8.9, group: Technological controls, title: Manage secure configurations, caps: [config-checks], nist: [CM-6]}
      - {id: A.8.15, group: Technological controls, title: Produce, keep and protect logs, caps: [data-any, retention-1y, siem-access], nist: [AU-2, AU-12]}
      - {id: A.8.16, group: Technological controls, title: Monitor for unusual behaviour, caps: [detect-any, data-network, notify], nist: [SI-4]}
      - {id: A.8.17, group: Technological controls, title: Synchronize clocks, caps: [timestamps], nist: [AU-8]}

  - id: hipaa
    name: HIPAA Security Rule
    version: 45 CFR 164 Subpart C
    publisher: US Department of Health and Human Services
    url: https://www.hhs.gov/hipaa/for-professionals/security/index.html
    notice: The HIPAA Security Rule is US federal regulation and is not subject to copyright.
    controls:
      - {id: 164.308(a)(1)(ii)(A), group: Administrative safeguards, title: Risk analysis, caps: [vuln-scan, config-checks], nist: [RA-5, CM-6]}
      - {id: 164.308(a)(1)(ii)(D), group: Administrative safeguards, title: Information system activity review, caps: [detect-any, triage], nist: [AU-6]}
      - {id: 164.308(a)(5)(ii)(B), group: Administrative safeguards, title: Protection from malicious software, caps: [data-malware, detect-malware], nist: [SI-3]}
      - {id: 164.308(a)(5)(ii)(C), group: Administrative safeguards, title: Log-in monitoring, caps: [data-auth, detect-auth], nist: [AC-7]}
      - {id: 164.308(a)(6)(ii), group: Administrative safeguards, title: Response and reporting, caps: [cases, notify, response], nist: [IR-4]}
      - {id: 164.312(b), group: Technical safeguards, title: Audit controls, caps: [data-any, data-auth, data-process], nist: [AU-2, AU-12]}
      - {id: 164.312(c)(1), group: Technical safeguards, title: Integrity, caps: [data-files], nist: [SI-7]}
      - {id: 164.312(e)(1), group: Technical safeguards, title: Transmission security, caps: [config-checks], nist: [SC-8]}

  - id: soc2
    name: SOC 2
    version: TSC 2017 (rev. 2022)
    publisher: AICPA
    url: https://www.aicpa-cima.com/resources/landing/system-and-organization-controls-soc-suite-of-services
    notice: Criteria numbers refer to the AICPA Trust Services Criteria. Titles here are Signalith's own summaries; read the criteria for their text. SOC 2 is a trademark of the AICPA.
    controls:
      - {id: CC4.1, group: Monitoring activities, title: Controls are evaluated on an ongoing basis, caps: [config-checks, vuln-scan], nist: [CA-7, CM-6]}
      - {id: CC6.8, group: Logical and physical access, title: Unauthorized or malicious software is prevented or detected, caps: [data-malware, detect-malware], nist: [SI-3]}
      - {id: CC7.1, group: System operations, title: Configuration changes and vulnerabilities are detected, caps: [config-checks, vuln-scan, data-files], nist: [CM-6]}
      - {id: CC7.2, group: System operations, title: System components are monitored for anomalies, caps: [data-any, detect-any, notify], nist: [SI-4]}
      - {id: CC7.3, group: System operations, title: Security events are evaluated, caps: [triage, cases], nist: [IR-5]}
      - {id: CC7.4, group: System operations, title: Security incidents are responded to, caps: [cases, response], nist: [IR-4]}
