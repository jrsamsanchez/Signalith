  - id: nis2
    name: NIS2 Directive
    version: (EU) 2022/2555
    publisher: European Union
    url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
    notice: Article numbers refer to Directive (EU) 2022/2555 and the Annex to Commission Implementing Regulation (EU) 2024/2690. Titles here are Signalith's own summaries; read the official texts on EUR-Lex, and your country's law that transposes the directive, for the requirements.
    scope: NIS2 asks for risk-management measures and incident reporting. Signalith gives evidence for the technical parts (monitoring, detection, incident handling, vulnerability and configuration checks, encryption and access control) and the records you need to report a significant incident on time. Governance, training, business continuity, supply chain security and the reports themselves are your organization's to run, so they are not listed.
    controls:
      - {id: 21(2)(a), group: "Art. 21: Risk-management measures", title: Risk analysis and information system security, also: "The policies are yours; Signalith supplies scan and configuration results for them.", caps: [vuln-scan, config-checks], nist: [RA-5, CM-6]}
      - {id: 21(2)(b), group: "Art. 21: Risk-management measures", title: Incident handling, caps: [detect-any, triage, cases, response], nist: [IR-4, IR-5]}
      - {id: 21(2)(e), group: "Art. 21: Risk-management measures", title: Vulnerability handling in maintaining systems, caps: [vuln-scan, config-checks], nist: [RA-5, SI-2]}
      - {id: 21(2)(f), group: "Art. 21: Risk-management measures", title: Assess whether the security measures work, also: "NIS2 asks for policies and procedures to assess the measures; Signalith's checks and scans are evidence for them.", caps: [config-checks, vuln-scan, detect-any], nist: [CA-7, CM-6]}
      - {id: 21(2)(g), group: "Art. 21: Risk-management measures", title: Basic cyber hygiene, also: "Basic cyber hygiene includes training, which Signalith cannot show.", caps: [config-checks, data-malware, detect-malware], nist: [CM-6, SI-3]}
      - {id: 21(2)(h), group: "Art. 21: Risk-management measures", title: Cryptography and encryption, also: "NIS2 asks for policies on the use of cryptography; Signalith checks encryption settings on hosts and its own connections.", caps: [config-checks, siem-tls], nist: [SC-8, SC-28]}
      - {id: 21(2)(i), group: "Art. 21: Risk-management measures", title: Access control and asset management, also: "This also covers human resources security and access control policies, which Signalith cannot show.", caps: [assets, data-inventory, data-change, detect-change], nist: [AC-2, CM-8]}
      - {id: 21(2)(j), group: "Art. 21: Risk-management measures", title: Multi-factor authentication, also: "NIS2 asks for multi-factor authentication across your systems, not only for Signalith; Signalith shows its own setting and watches sign-ins.", caps: [siem-mfa, data-auth, detect-auth], nist: [IA-2]}
      - {id: 23(1), group: "Art. 23: Reporting obligations", title: Significant incidents are found and reported without undue delay, also: "Notifying the CSIRT or competent authority is yours to do; Signalith helps you find the incident in time.", caps: [detect-any, notify, triage], nist: [IR-6, SI-4]}
      - {id: 23(4)(a), group: "Art. 23: Reporting obligations", title: Early warning within 24 hours, also: "Sending the early warning to your CSIRT or authority is yours; Signalith helps you notice in time and keeps the record.", caps: [notify, triage, cases], nist: [IR-6]}
      - {id: 23(4)(b), group: "Art. 23: Reporting obligations", title: "Incident notification within 72 hours, with severity, impact and indicators", also: "Writing and sending the notification is yours; the investigation holds what goes into it.", caps: [cases, record-content, intel], nist: [IR-6]}
      - {id: 23(4)(d), group: "Art. 23: Reporting obligations", title: "Final report within one month, with root cause and measures taken", also: "Writing and sending the final report is yours; the investigation holds what goes into it.", caps: [cases, search, retention-90], nist: [IR-4]}
      - {id: IR 3.2, group: "Implementing Regulation 2024/2690 (digital providers)", title: Monitoring and logging, caps: [data-any, data-auth, data-network, detect-any, timestamps, siem-access, retention-90], nist: [AU-2, AU-6, AU-12, SI-4]}
      - {id: IR 3.5, group: "Implementing Regulation 2024/2690 (digital providers)", title: Incident response, caps: [cases, response, notify], nist: [IR-4]}

  - id: gdpr
    name: GDPR
    version: (EU) 2016/679
    publisher: European Union
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    notice: Article numbers refer to Regulation (EU) 2016/679, the General Data Protection Regulation. Titles here are Signalith's own summaries; read the official text on EUR-Lex for the requirements.
    scope: The GDPR is about how personal data is used, and logs hold personal data too (user names, addresses, hosts). Signalith gives evidence for two things. First, how it treats the personal data in your logs itself (limited access, two-step sign-in, encryption, an audit trail, deletion after a set time). Second, security of processing and breach notification for your other systems. Lawful basis, records of processing, data subject rights and the notifications themselves are your organization's, and your data protection officer decides what is enough.
    controls:
      - {id: 5(1)(e), group: Personal data in your logs, title: Logs are kept no longer than needed, caps: [retention-limit], nist: []}
      - {id: 5(1)(f), group: Personal data in your logs, title: Logs are protected from unauthorized access and change, caps: [siem-access, siem-tls, siem-secrets], nist: []}
      - {id: 5(2), group: Personal data in your logs, title: Who did what in Signalith is recorded, caps: [siem-audit, siem-access], nist: []}
      - {id: "25", group: Personal data in your logs, title: Data protection by default in the SIEM, caps: [siem-access, siem-mfa, retention-limit], nist: []}
      - {id: 32(1)(a), group: "Art. 32: Security of processing", title: Encryption of personal data, caps: [config-checks, siem-tls], nist: [SC-8, SC-28]}
      - {id: 32(1)(b), group: "Art. 32: Security of processing", title: "Ongoing confidentiality, integrity and availability", caps: [data-auth, detect-any, source-health, storage-guard], nist: [SI-4, AU-5]}
      - {id: 32(1)(d), group: "Art. 32: Security of processing", title: Security measures are tested and assessed regularly, also: "Article 32 asks for a process covering organisational measures too; Signalith shows the technical checks.", caps: [config-checks, vuln-scan], nist: [CA-7, CM-6, RA-5]}
      - {id: 33(1), group: "Art. 33-34: Personal data breaches", title: Breaches are noticed in time to notify within 72 hours, also: "Deciding whether a breach must be notified, and notifying the supervisory authority, are yours.", caps: [detect-any, detect-network, notify, triage], nist: [IR-6, SI-4]}
      - {id: 33(3), group: "Art. 33-34: Personal data breaches", title: The notification can describe the breach and its likely consequences, also: "Writing the notification is yours; the investigation and searches hold what goes into it.", caps: [cases, search, record-content], nist: [IR-4]}
      - {id: 33(5), group: "Art. 33-34: Personal data breaches", title: "Every breach is documented, with its facts, effects and remedial action", caps: [cases, retention-1y], nist: [IR-5]}
      - {id: "34", group: "Art. 33-34: Personal data breaches", title: The people affected can be found and told, also: "Telling the people affected is yours; searches and asset lists help find who they are.", caps: [cases, search, assets], nist: [IR-6]}
