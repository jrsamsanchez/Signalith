      - {id: SI-4, group: System and Information Integrity, title: System Monitoring, caps: [detect-any, data-process, data-network, notify], nist: [SI-4]}
      - {id: SI-5, group: System and Information Integrity, title: "Security Alerts, Advisories, and Directives", caps: [intel], nist: [SI-5]}
