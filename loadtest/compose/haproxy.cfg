# All three servers behind one address, without sticky sessions: HTTPS is
# passed through as TCP, so each server shows its own certificate. Once the
# servers accept the PROXY protocol (server.proxy_protocol), add
# send-proxy-v2 to each server line so they see the real client addresses.
global
  log stdout format raw local0

defaults
  mode tcp
  log global
  timeout connect 5s
  timeout client 10m
  timeout server 10m

frontend https
  bind :8443
  default_backend siem

backend siem
  balance roundrobin
  option httpchk GET /readyz
  http-check expect status 200
  default-server check inter 2s fall 2 rise 2
  server siem-a siem-a:8080
  server siem-b siem-b:8080
  server siem-c siem-c:8080
