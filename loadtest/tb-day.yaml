# About a terabyte a day: 25,000 events a second of about 500 bytes, for
# four hours, while five analysts search and the scheduled detections
# run. Made for the cloud lab's load test (size = "loadtest" in
# deploy/lab, run with sudo lab-loadtest on signalith-1), which also
# records each machine's CPU, memory and disk and how far OpenSearch is
# behind; see docs/cloud-lab.md. It finds where the setup saturates, so
# its numbers are recorded rather than judged. Counting about 360 million
# stored events one by one would take longer than the run, so it does
# not verify them; s1-small does, at a size it can count.
name: tb-day
description: 25k events/s (about 1 TB a day) for 4 hours with 5 analysts searching.
targets: [https://signalith-1.lab.internal:9000]
agent_targets: [https://signalith-1.lab.internal:7779]
ca_file: /root/loadtest/ca.pem
credentials:
  admin_file: /root/loadtest/admin.txt
  token_file: /root/loadtest/token.txt
drain: 10m
phases:
  - {name: warm, for: 10m, agents: {n: 200, rate: 5000, event_bytes: 500}}
  - {name: 15k, for: 10m, agents: {n: 200, rate: 15000, event_bytes: 500}, users: {n: 5, think: 30s, create: true}}
  - {name: 1tb, for: 4h, agents: {n: 200, rate: 25000, event_bytes: 500}, users: {n: 5, think: 30s, create: true}}
criteria:
  - {name: ingest_events_per_second, phase: warm}
  - {name: ingest_events_per_second, phase: 15k}
  - {name: ingest_events_per_second, phase: 1tb}
  - {name: ingest_p99_ms, phase: 15k}
  - {name: ingest_p99_ms, phase: 1tb}
  - {name: ingest_error_rate, phase: 1tb}
  - {name: search_p95_ms, phase: 15k}
  - {name: search_p95_ms, phase: 1tb}
  - {name: page_p95_ms, phase: 1tb}
  - {name: events_undelivered}
  - {name: generator_lag_ms}
