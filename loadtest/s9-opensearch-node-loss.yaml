# S9, lab size: one of three OpenSearch nodes is stopped under load. The
# servers list every node in opensearch.urls and carry on through the
# others; Signalith's own indices ({prefix}_*) lose a copy (yellow) but
# never their last one (red). The load generator also reads OpenSearch
# through any node that answers. Skipped on servers without
# opensearch.urls. See README.md, "S9".
name: s9-opensearch-node-loss
description: Stop one of three OpenSearch nodes under load; ingest carries on.
needs: [opensearch_urls]
targets: [https://lb.lab:8443]
ca_file: lab/ca.pem
credentials:
  admin_file: lab/admin.txt
  token_file: lab/token.txt
opensearch:
  url: https://os-1.lab:9200
  urls: [https://os-2.lab:9200, https://os-3.lab:9200]
  ca: lab/opensearch-ca.pem
  cert: lab/opensearch-client.pem
  key: lab/opensearch-client-key.pem
drain: 5m
settle: 3m
phases:
  - {name: warm, for: 1m, agents: {n: 200, rate: 10000}}
  - {name: one_node_down, for: 5m, agents: {n: 200, rate: 10000}, users: {n: 10, create: true}}
  - {name: back, for: 3m, agents: {n: 200, rate: 10000}}
faults:
  - {at: 2m, kind: cmd, for: 4m, cmd: "ssh os-2.lab sudo systemctl stop opensearch", undo: "ssh os-2.lab sudo systemctl start opensearch"}
criteria:
  - {name: opensearch_red_samples, max: 0}
  - {name: opensearch_unreachable_samples, max: 0}
  - {name: ingest_error_rate, phase: one_node_down, max: 0.01}
  - {name: ingest_p99_ms, phase: one_node_down, max: 2000}
  - {name: search_p95_ms, phase: one_node_down, max: 3000}
  - {name: unexpected_signouts, max: 0}
  - {name: events_lost, max: 0}
  - {name: events_duplicated, max: 0}
